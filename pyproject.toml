[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-sensitivity"
version = "0.1.0"
description = "Does Claude's agentic success change when the harness presents the same information differently?"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["tasks", "perturb", "runner", "analysis"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
